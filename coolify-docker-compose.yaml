services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: ["-p", "default", "gateway", "run"]
    ports:
      - "${GATEWAY_PORT:-9118}:9118"
    volumes:
      - ${HERMES_DATA_VOLUME:-~/.hermes}:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - GATEWAY_PORT=${GATEWAY_PORT:-9118}

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]
    ports:
      - "${DASHBOARD_PORT:-9119}:9119"
    depends_on:
      - gateway
    volumes:
      - ${HERMES_DATA_VOLUME:-~/.hermes}:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-your-secure-password}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-long-random-string-at-least-32-chars}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-9119}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9119/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

